id: jrr-tolkien
name: J.R.R. Tolkien
birthYear: 1892
deathYear: 1973
bio: J.R.R. Tolkien was an English scholar and author best known for creating the landmark high fantasy classics The Hobbit and The Lord of the Rings, which laid the foundation for modern fantasy literature. A distinguished professor of Anglo-Saxon and English language at Oxford, his deep passion for philology and ancient mythology drove him to invent rich constructed languages and the vast lore of Middle-earth. Born in Bloemfontein, South Africa, he spent most of his life in England, where his academic research and fiction profoundly shaped 20th-century storytelling.
