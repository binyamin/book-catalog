id: douglas-adams
name: Douglas Adams
birthYear: 1952
deathYear: 2001
bio: >-
  Douglas Adams was a celebrated British author and humorist best known for creating the iconic science fiction series <cite>The Hitchhiker's Guide to the Galaxy</cite>, which began as a BBC radio comedy before evolving into a worldwide literary phenomenon. Renowned for his sharp wit and satirical take on modern life, he also wrote the <cite>Dirk Gently</cite> series and was a passionate advocate for technology and environmental conservation.
