id: frank-herbert
name: Frank Herbert
birthYear: 1920
deathYear: 1986
bio: >-
  Frank Herbert was an American science fiction author best known for his landmark 1965 novel Dune and its five sequels, which transformed modern science fiction with their intricate web of ecology, politics, and religion. Born in Tacoma, Washington, he worked for decades as a journalist, photographer, and ecological consultant before his literary success. Widely celebrated for creating one of the most richly detailed universes in literature, he lived much of his life in the Pacific Northwest, where the region’s natural landscapes deeply influenced his writing.
