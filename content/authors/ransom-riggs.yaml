bio: >-
  Ransom Riggs is an American writer and filmmaker, best known for the series <cite>Miss Peregrine’s Home for Peculiar Children</cite>. Riggs was born on a farm in Maryland and grew up in southern Florida. He studied literature at Kenyon College and film at the University of Southern California. He lives in Los Angeles with his wife, bestselling author Tahereh Mafi, and their family.
