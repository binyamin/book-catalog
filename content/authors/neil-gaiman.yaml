id: neil-gaiman
name: Neil Gaiman
birthYear: 1960
deathYear: null
bio: >-
  Neil Gaiman is an English author celebrated for his work in short fiction,
  novels, comic books, and films, often blending modern reality with dark,
  richly imagined fantasy. He spent his youth devouring the works of C.S. Lewis
  and J.R.R. Tolkien, and credits librarians with fostering a life-long love of
  reading. Born in Hampshire, UK, he now lives in the United States.
