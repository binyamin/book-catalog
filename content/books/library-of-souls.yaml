summary: "To find their friends, Jacob, Emma, and Addison go to Devil’s Acre, a crime-ridden Victorian underworld, but they uncover an operation far more sinister than they imagined.\nIn Victorian England, Jacob discovers the Library of Souls, a hidden collection that holds the key to saving his peculiar friends and the entire peculiar world. Inside the library, he encounters an Ymbryne, a powerful ancient creature who possesses the ability to control time and manipulate souls.\nWith time running out, Jacob must unlock his own peculiar abilities and confront his darkest fears to rescue his friends from the clutches of the malevolent wights."
