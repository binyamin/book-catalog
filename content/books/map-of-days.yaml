summary: "The battle for the soul of peculiardom has been won, but for Jacob Portman and his friends, the true journey is only beginning. The story shifts from the ancient loops of Europe to the sprawling, lawless landscape of peculiar America — a place where the rules are different and the dangers are hidden behind the veneer of normalcy. As Jacob uncovers long-buried secrets regarding his grandfather’s double life, a new mission emerges. Under the watchful eye of Miss Peregrine, it is an atmospheric exploration of heritage and identity."
