summary: "In the wake of Paul Atreides’ legacy, the fate of his children becomes bound to the shifting future of Arrakis itself. As old powers regroup and new ones awaken, the desert planet remains a place of peril, memory, and change. Family, prophecy, and survival intertwine in a world remade by history."
