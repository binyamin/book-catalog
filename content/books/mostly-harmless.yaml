summary: "Arthur attempts to find peace as a professional sandwich maker on the remote planet Lamuella, but his solitude is shattered by the arrival of his daughter, Random. As she sets off on a reckless quest to find her ancestral home Arthur and Ford must navigate a confusing web of parallel dimensions and bureaucratic conspiracies."
