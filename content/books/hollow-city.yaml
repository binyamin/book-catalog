summary: "To find a cure for Miss Peregrine, their beloved headmistress, Jacob Portman and his peculiar friends journey through a time loop to London, 1940 — the peculiar capital of the world.\nAlong the way, the children encounter new allies and a menagerie of peculiar animals, but hideous surprises and betrayals lurk around every corner. And before Jacob can deliver the peculiar children to safety, he must make an important decision about his love for Emma Bloom."
