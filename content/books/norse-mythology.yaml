summary: "Neil Gaiman breathes fresh life into the ancient northern sagas, from the dawn of the nine worlds to the inevitable twilight of the gods. Here are the tales of Odin the All-father, the wise and the one-eyed; Thor, his son, as formidable as he is occasionally gullible; and Loki, the silver-tongued trickster who walks the line between ally and enemy. It is a world of giants, dwarves, and world-ending wolves — a cycle of wonder and betrayal, told with the wit and dark elegance of a modern master."
