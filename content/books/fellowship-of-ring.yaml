summary: The fate of Middle-earth hangs in the balance as an ancient and terrifying power awakens in Mordor. When the young hobbit Frodo Baggins inherits a seemingly innocent gold ring, he discovers it is the One Ring, the instrument of absolute dominion for the Dark Lord Sauron. Tasked with an impossible journey, Frodo and a diverse fellowship of elves, dwarves, men, and hobbits set out to cast the artifact into the fires of Mount Doom. It is an epic beginning to a legendary saga of friendship, sacrifice, and encroaching darkness.
