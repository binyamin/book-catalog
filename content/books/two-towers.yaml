title: The Two Towers
author: jrr-tolkien
publicationYear: 1954
genre:
  - Fantasy
summary: The fellowship is broken, but the quest to destroy the One Ring must continue across a fractured Middle-earth. Split into separate paths, Aragorn, Legolas, and Gimli race across war-torn plains to aid the kingdom of Rohan against the armies of Saruman. Meanwhile, Frodo and Samwise Gamgee press deeper into enemy territory, guided by the treacherous Gollum, who remains hopelessly obsessed with reclaiming his lost treasure. It is a sweeping chapter of rising tension, desperate battles, and the enduring strength of loyalty in the face of despair.
