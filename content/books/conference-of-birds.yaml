summary: "With the world teetering on the edge of a catastrophic war, the stakes for Jacob Portman and Miss Peregrine’s wards have never been higher. A fragile peace is shattered by the arrival of a prophecy that could either save or undo the peculiar race. Forced into a desperate race against time, Jacob and his extraordinary friends must bridge the divide between rival factions and protect Noor Pradesh, a girl who may be the key to their survival. It is a high-stakes adventure defined by mounting tension, ancient rivalries, and the shadow of an enemy who refuses to stay dead."
