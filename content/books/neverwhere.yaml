summary: "Beneath the familiar streets of London lies a world of shadows and monsters, a city of the gaps called London Below. This spellbinding urban fantasy centers on Richard Mayhew, a man whose act of kindness toward a bleeding girl named Door expels him from his ordinary life. Now invisible to the world above, Richard must navigate a subterranean realm of knights in armor, deadly assassins, and angel-guarded labyrinths. It is a haunting, witty, and dangerously beautiful journey into the cracks of reality, where forgotten things remain very much alive."
