summary: Before the rings were forged and before hobbits walked the Shire, there was the mythic creation of Arda and the tragic history of the First Age. This monumental masterwork chronicles the epic struggles of Elves and Men against the original dark lord, Morgoth. At the heart of the saga are the Silmarils, three miraculous jewels containing the pure light of the Two Trees, which spark greed, war, and oath-bound tragedy. It is a grand, poetic tapestry of ancient lore, heroism, and the sorrowful beauty that shaped Middle-earth.
