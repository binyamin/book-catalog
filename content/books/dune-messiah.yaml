summary: "Years after the rise of Paul Atreides, the burden of power settles over an empire transformed by faith and triumph. As court intrigues, hidden loyalties, and rival designs close in around him, Paul must confront the distance between vision and rule. The cost of becoming a legend grows painfully clear.\n"
