summary: "Arthur and Ford are rescued from their prehistoric exile to help prevent the xenophobic inhabitants of the planet Krikkit from destroying the rest of the galaxy. The story involves time-traveling sofas, a disgruntled swamp creature named Agrajag, and a high-stakes quest to recover the pillars of the Krikkit War Memorial."
