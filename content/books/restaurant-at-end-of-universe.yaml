summary: "The crew escapes a Vogon attack and travels to Milliways, a restaurant situated at the literal chronological end of all things. After a series of mishaps involving a stolen stunt ship and a teleportation accident, Arthur and Ford find themselves stranded on prehistoric Earth with a group of useless middle-managers."
